name: Publish F-Droid repository

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2,8,14,20 * * *'
    - cron: '23 3 1 * *'

concurrency:
  group: fdroid-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.schedule != '23 3 1 * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
        id: pages

      - name: Fetch and verify APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export PATH="$ANDROID_HOME/build-tools/36.0.0:$PATH"
          python3 fetch-apks.py build/fdroid/repo

      - name: Install F-Droid tools
        run: |
          pipx install fdroidserver==2.4.5

      - name: Sign and verify the index
        working-directory: build/fdroid
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
          FDROID_KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
          FDROID_KEYSTORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          : "${FDROID_KEYSTORE_BASE64:?Set FDROID_KEYSTORE_BASE64}"
          : "${FDROID_KEYSTORE_PASSWORD:?Set FDROID_KEYSTORE_PASSWORD}"
          export FDROID_KEYSTORE="$(mktemp)"
          trap 'rm -f -- "$FDROID_KEYSTORE" config.yml' EXIT
          printf '%s' "$FDROID_KEYSTORE_BASE64" | base64 --decode > "$FDROID_KEYSTORE"
          python3 - <<'PY'
          import json
          import os

          with open("config.yml", "w") as config:
              json.dump({
                  "repo_url": os.environ["PAGES_URL"].rstrip("/") + "/fdroid/repo",
                  "repo_name": "WhiteDNS",
                  "repo_description": "Official Android builds of WhiteAesther, WhiteVPN and WhiteDNS.",
                  "archive_older": 0,
                  "keystore": os.environ["FDROID_KEYSTORE"],
                  "repo_keyalias": "whitedns-fdroid",
                  "keystorepass": os.environ["FDROID_KEYSTORE_PASSWORD"],
                  "keypass": os.environ["FDROID_KEYSTORE_PASSWORD"],
              }, config)
          PY
          umask 022
          fdroid update --create-metadata --rename-apks
          test -s repo/entry.jar
          jq -e '.packages | keys == ["com.whitedns.vpn", "com.whitedns.whiteaesther", "shop.whitedns.client"]' repo/index-v2.json
          fingerprint="$(keytool -exportcert -alias whitedns-fdroid -keystore "$FDROID_KEYSTORE" -storepass:env FDROID_KEYSTORE_PASSWORD | sha256sum | cut -d ' ' -f 1)"
          printf 'Add in F-Droid: %s/fdroid/repo?fingerprint=%s\n' "${PAGES_URL%/}" "$fingerprint" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p ../site/fdroid
          mv repo ../site/fdroid/
          repo_address="${PAGES_URL%/}/fdroid/repo"
          sed -e "s|REPO_URL|${repo_address}?fingerprint=$fingerprint|g" \
              -e "s|ADD_URL|fdroidrepos://${repo_address#https://}/?fingerprint=$fingerprint|g" \
              ../../index.html > ../site/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

      - uses: actions/deploy-pages@v5
        id: deploy

  keep-schedule-active:
    # GitHub disables schedules after 60 days of inactivity in public repositories.
    if: github.event.schedule == '23 3 1 * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Record monthly maintenance
        run: |
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --allow-empty -m 'Keep the F-Droid release schedule active'
          git push origin "HEAD:$GITHUB_REF_NAME"
